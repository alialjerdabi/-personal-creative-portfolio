<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    The same mark the nav draws: a rule and a rising sun. Drawn, not
    licensed, and a placeholder until Ali supplies his real logo.

    It carries its own ground rather than sitting on transparency —
    a transparent favicon with near-black strokes disappears entirely
    against a dark browser tab, which is where most people will see it.
  -->
  <rect width="40" height="40" rx="9" fill="#f1efe9" />
  <g
    transform="translate(0,6)"
    fill="none"
    stroke="#1a1713"
    stroke-width="2.6"
    stroke-linecap="round"
  >
    <path d="M4 22h32" />
    <path d="M8.5 22a11.5 11.5 0 0 1 23 0" />
    <path d="M20 4.5v3M30.5 9l2-2M9.5 9l-2-2" />
  </g>
</svg>
